<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magma Labs Blog</title>
    <meta
      name="description"
      content="Engineering notes, product thinking, and release updates from Magma Labs."
    />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-header data-site-header></header>

    <main id="main" class="main">
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">
            <span class="eyebrow-dot" aria-hidden="true"></span>
            <span>Blog</span>
          </div>
          <h1>
            <span class="accent">Blog</span>.
          </h1>
          <p class="lead">
            Uncovering the mysteries of life, one week at a time.
          </p>

          <div class="toolbar" aria-label="Blog filters">
            <input
              class="input"
              id="blog-search"
              type="search"
              placeholder="Search posts (e.g., caching, security, roadmap)…"
              autocomplete="off"
            />
            <div class="chips" data-blog-tags aria-label="Tags"></div>
            <div class="fineprint" id="blog-count" aria-live="polite"></div>
          </div>
        </div>
      </section>

      <section class="section alt">
        <div class="container">
          <div class="grid cols-2" data-blog-list aria-label="Blog posts"></div>
          <noscript>
            <p class="fineprint">
              Enable JavaScript to load posts from <code>blog.json</code>.
            </p>
          </noscript>

          <div class="inline-links">
            <a class="btn primary" href="index.html#contact">Subscribe (demo)</a>
            <a class="btn secondary" href="products.html">Explore products</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="script.js" defer></script>
  </body>
</html>
