<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magma Labs Blog Builder</title>
    <meta
      name="description"
      content="Build Magma Labs blog posts with a block editor and export a JSON-ready post object."
    />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/svg+xml" href="https://magmalabsdev.github.io/site-data/logo.svg" />
    <link rel="stylesheet" href="https://magmalabsdev.github.io/site-data/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-header data-site-header></header>

    <main id="main" class="main">
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">
            <span class="eyebrow-dot" aria-hidden="true"></span>
            <span>Blog Builder</span>
          </div>
          <h1>
            Build a <span class="accent">Blog Post</span>
          </h1>
          <p class="lead">
            Assemble cards, edit each component, preview the result, and copy a
            post object ready for <code>blog.json</code>.
          </p>
        </div>
      </section>

      <section class="section alt">
        <div class="container">
          <div class="blog-builder-app" data-blog-builder>
            <noscript>
              <p class="fineprint">
                Enable JavaScript to use the builder and export a post object.
              </p>
            </noscript>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="https://magmalabsdev.github.io/site-data/core.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
