<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magma Labs Blog Post</title>
    <meta
      name="description"
      content="Read a Magma Labs blog post."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-header data-site-header></header>

    <main id="main" class="main">
      <section class="section">
        <div class="container">
          <div data-blog-post aria-live="polite"></div>
          <noscript>
            <p class="fineprint">
              Enable JavaScript to load posts from <code>blog.json</code>.
            </p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="/script.js" defer></script>
  </body>
</html>
