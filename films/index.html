<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Original Films — Magma Labs</title>
  <meta name="description" content="Original short films by Magma Labs." />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* ── Films intro animation (scoped) ─────────────────── */

    .films-intro {
      position: fixed;
      inset: 0;
      z-index: 200;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      transition: bottom 0.85s cubic-bezier(0.25, 0, 0, 1);
    }
    .films-intro.is-collapsed { bottom: 50vh; }

    /* Black overlay */
    .films-bg {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: #000;
      opacity: 1;
      transition: opacity 1.5s linear;
      pointer-events: none;
    }
    .films-bg.is-faded { opacity: 0; }

    /* Diagonal shine */
    .films-shine {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      overflow: hidden;
    }
    .films-shine::after {
      content: '';
      position: absolute;
      top: -100%;
      left: -50%;
      width: 40%;
      height: 300%;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
      transform: rotate(20deg) translateX(-200%);
      transition: transform 0.5s linear;
    }
    .films-shine.is-shining::after {
      transform: rotate(20deg) translateX(700%);
    }

    /* Three-column stage: [text] | [logo] | [text] */
    .films-stage {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(32px, 7vw, 96px);
      width: 100%;
      padding: 0 clamp(24px, 5vw, 72px);
      box-sizing: border-box;
    }

    .films-side {
      flex: 1;
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .films-side--left  { justify-content: flex-end; }
    .films-side--right { justify-content: flex-start; }

    .films-brand-text,
    .films-title-text {
      font-size: clamp(1.1rem, 2.8vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--accent-800, #1a0a30);
      opacity: 0;
      transition: opacity 3s linear;
      white-space: nowrap;
    }
    .films-brand-text.is-visible,
    .films-title-text.is-visible { opacity: 1; }

    .films-center {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Logo wrapper — --lw drives all proportional sizing below */
    .films-logo-wrap {
      position: relative;
      --lw: clamp(23px, 3.17vw, 40px);
      width: var(--lw);
    }

    /* Core hexagon */
    .films-core {
      position: relative;
      z-index: 10;
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
    }
    .films-core.is-in { opacity: 1; transform: scale(1); }
    .films-core svg { width: 100%; height: auto; display: block; }

    /*
     * Spokes: two-layer structure for consistent radial gap.
     *   .films-spokes     — zero-size anchor fixed at core center
     *   .films-spoke-arm  — zero-size anchor at core center; rotates during fan
     *   .films-spoke      — SVG container; rises during rise phase; always
     *                       `gap` above the arm anchor (= core center) in
     *                       the arm's own coordinate frame → consistent radial
     *                       distance regardless of rotation angle
     */
    .films-spokes {
      position: absolute;
      left: 50%;
      bottom: 50%;
      width: 0;
      height: 0;
      /*
       * Proportions from full.svg (439×447, core 87.62×88.68 px):
       *   gap   = (core_center_y − spoke_bottom_y) / core_w = 51.26/87.62 = 0.585
       *   spoke_w / core_w = 102.4  / 87.62 = 1.169
       *   spoke_h / core_w = 172.34 / 87.62 = 1.967
       * --lw inherited from .films-logo-wrap
       */
      --spoke-gap: calc(var(--lw) * 0.585);
      --spoke-w:   calc(var(--lw) * 1.169);
      --spoke-h:   calc(var(--lw) * 1.967);
    }

    /* Arm: zero-size, rotates to final angle for each spoke */
    .films-spoke-arm {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0; /* = core center */
      transition: transform 0.9s cubic-bezier(0.25, 0, 0, 1);
    }

    /* z-order during rise (all arms at 0°, spokes stacked): blue on top */
    .films-spoke-arm[data-color="red"]    { z-index: 1; }
    .films-spoke-arm[data-color="orange"] { z-index: 2; }
    .films-spoke-arm[data-color="green"]  { z-index: 3; }
    .films-spoke-arm[data-color="yellow"] { z-index: 4; }
    .films-spoke-arm[data-color="white"]  { z-index: 5; }
    .films-spoke-arm[data-color="blue"]   { z-index: 6; }

    /* Spoke: positioned gap-px above arm anchor; handles the rise animation */
    .films-spoke {
      position: absolute;
      left: 0;
      bottom: var(--spoke-gap);
      width: var(--spoke-w);
      height: var(--spoke-h);
      margin-left: calc(var(--spoke-w) * -0.5);
      transform: translateY(60px);
      opacity: 0;
      transition: transform 0.9s cubic-bezier(0.25, 0, 0, 1),
                  opacity 0.7s ease;
    }
    .films-spoke svg { width: 100%; height: 100%; display: block; }

    /* Rise: spokes surface (arm stays at 0° for all) */
    .films-spokes.is-up .films-spoke {
      transform: translateY(0);
      opacity: 1;
    }

    /* Fan: each arm rotates to its final clockwise angle */
    .films-spokes.is-fanned .films-spoke-arm[data-angle="0"]   { transform: rotate(0deg);   }
    .films-spokes.is-fanned .films-spoke-arm[data-angle="60"]  { transform: rotate(60deg);  }
    .films-spokes.is-fanned .films-spoke-arm[data-angle="120"] { transform: rotate(120deg); }
    .films-spokes.is-fanned .films-spoke-arm[data-angle="180"] { transform: rotate(180deg); }
    .films-spokes.is-fanned .films-spoke-arm[data-angle="240"] { transform: rotate(240deg); }
    .films-spokes.is-fanned .films-spoke-arm[data-angle="300"] { transform: rotate(300deg); }

    /* Page content — starts below viewport, slides to below intro panel */
    .films-content {
      padding-top: 100vh;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, padding-top 0.85s cubic-bezier(0.25, 0, 0, 1);
    }
    .films-content.is-visible {
      padding-top: calc(50vh + 40px);
      opacity: 1;
      pointer-events: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      .films-intro { display: none !important; }
      .films-content {
        opacity: 1;
        pointer-events: auto;
        padding-top: 0;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Full-screen animation overlay -->
  <div class="films-intro" id="films-intro" aria-hidden="true" role="img" aria-label="Opening animation">
    <div class="films-bg"    id="films-bg"></div>
    <div class="films-shine" id="films-shine"></div>

    <div class="films-stage">
      <!-- Left: brand name -->
      <div class="films-side films-side--left">
        <span class="films-brand-text" id="films-brand">Magma Labs</span>
      </div>

      <!-- Center: animated logo -->
      <div class="films-center">
        <div class="films-logo-wrap">

          <!-- Core hexagon (#2F1254) -->
          <div class="films-core" id="films-core">
            <svg width="95" height="89" viewBox="0 0 95 89" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3.43014 57.1401C-1.14287 49.2195 -1.14287 39.4608 3.43014 31.5401L14.2499 12.7997C18.823 4.87903 27.2742 -0.000289917 36.4202 -0.000289917H58.0599C67.2058 -0.000289917 75.6571 4.87904 80.2301 12.7997L91.0499 31.5401C95.6229 39.4608 95.6229 49.2195 91.0499 57.1401L80.2301 75.8806C75.6571 83.8012 67.2059 88.6806 58.0599 88.6806H36.4202C27.2742 88.6806 18.8229 83.8012 14.2499 75.8806L3.43014 57.1401Z" fill="#2F1254"/>
            </svg>
          </div>

          <!--
            6 spoke arms — DOM order = z-order (red lowest, blue highest).
            Each .films-spoke-arm is a zero-size anchor at core center that
            rotates to its final angle during the fan phase.
            The .films-spoke inside rises 10 px clear of the core circumradius.
          -->
          <div class="films-spokes" id="films-spokes">

            <!-- Upper-left 300° | Red #FF2121 | z:1 -->
            <div class="films-spoke-arm" data-color="red" data-angle="300">
              <div class="films-spoke">
                <svg viewBox="0 0 111 181" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M106.4 121.14C106.4 125.634 105.217 130.049 102.97 133.941L88.1897 159.54C83.6167 167.461 75.1655 172.34 66.0197 172.34H44.3802C35.2344 172.34 26.7833 167.461 22.2102 159.54L7.42978 133.941C5.18278 130.049 3.99983 125.634 3.99984 121.14L3.99997 25.6C3.99998 11.4615 15.4615 0 29.6 0L80.8004 0C94.9389 0 106.4 11.4615 106.4 25.6L106.4 121.14Z" fill="#FF2121"/>
                </svg>
              </div>
            </div>

            <!-- Lower-left 240° | Orange #FF8400 | z:2 -->
            <div class="films-spoke-arm" data-color="orange" data-angle="240">
              <div class="films-spoke">
                <svg viewBox="0 0 111 181" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M106.4 121.14C106.4 125.634 105.217 130.049 102.97 133.941L88.1897 159.54C83.6167 167.461 75.1655 172.34 66.0197 172.34H44.3802C35.2344 172.34 26.7833 167.461 22.2102 159.54L7.42978 133.941C5.18278 130.049 3.99983 125.634 3.99984 121.14L3.99997 25.6C3.99998 11.4615 15.4615 0 29.6 0L80.8004 0C94.9389 0 106.4 11.4615 106.4 25.6L106.4 121.14Z" fill="#FF8400"/>
                </svg>
              </div>
            </div>

            <!-- Bottom 180° | Green #4FEA47 | z:3 -->
            <div class="films-spoke-arm" data-color="green" data-angle="180">
              <div class="films-spoke">
                <svg viewBox="0 0 111 181" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M106.4 121.14C106.4 125.634 105.217 130.049 102.97 133.941L88.1897 159.54C83.6167 167.461 75.1655 172.34 66.0197 172.34H44.3802C35.2344 172.34 26.7833 167.461 22.2102 159.54L7.42978 133.941C5.18278 130.049 3.99983 125.634 3.99984 121.14L3.99997 25.6C3.99998 11.4615 15.4615 0 29.6 0L80.8004 0C94.9389 0 106.4 11.4615 106.4 25.6L106.4 121.14Z" fill="#4FEA47"/>
                </svg>
              </div>
            </div>

            <!-- Lower-right 120° | Yellow #FEE840 | z:4 -->
            <div class="films-spoke-arm" data-color="yellow" data-angle="120">
              <div class="films-spoke">
                <svg viewBox="0 0 111 181" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M106.4 121.14C106.4 125.634 105.217 130.049 102.97 133.941L88.1897 159.54C83.6167 167.461 75.1655 172.34 66.0197 172.34H44.3802C35.2344 172.34 26.7833 167.461 22.2102 159.54L7.42978 133.941C5.18278 130.049 3.99983 125.634 3.99984 121.14L3.99997 25.6C3.99998 11.4615 15.4615 0 29.6 0L80.8004 0C94.9389 0 106.4 11.4615 106.4 25.6L106.4 121.14Z" fill="#FEE840"/>
                </svg>
              </div>
            </div>

            <!-- Upper-right 60° | White #F3F3F3 | z:5 -->
            <div class="films-spoke-arm" data-color="white" data-angle="60">
              <div class="films-spoke">
                <svg viewBox="0 0 111 181" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M106.4 121.14C106.4 125.634 105.217 130.049 102.97 133.941L88.1897 159.54C83.6167 167.461 75.1655 172.34 66.0197 172.34H44.3802C35.2344 172.34 26.7833 167.461 22.2102 159.54L7.42978 133.941C5.18278 130.049 3.99983 125.634 3.99984 121.14L3.99997 25.6C3.99998 11.4615 15.4615 0 29.6 0L80.8004 0C94.9389 0 106.4 11.4615 106.4 25.6L106.4 121.14Z" fill="#F3F3F3"/>
                </svg>
              </div>
            </div>

            <!-- Top 0° | Blue #3590FF | z:6 (highest — shown on top during rise) -->
            <div class="films-spoke-arm" data-color="blue" data-angle="0">
              <div class="films-spoke">
                <svg viewBox="0 0 111 181" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M106.4 121.14C106.4 125.634 105.217 130.049 102.97 133.941L88.1897 159.54C83.6167 167.461 75.1655 172.34 66.0197 172.34H44.3802C35.2344 172.34 26.7833 167.461 22.2102 159.54L7.42978 133.941C5.18278 130.049 3.99983 125.634 3.99984 121.14L3.99997 25.6C3.99998 11.4615 15.4615 0 29.6 0L80.8004 0C94.9389 0 106.4 11.4615 106.4 25.6L106.4 121.14Z" fill="#3590FF"/>
                </svg>
              </div>
            </div>

          </div><!-- /.films-spokes -->
        </div><!-- /.films-logo-wrap -->
      </div><!-- /.films-center -->

      <!-- Right: page title -->
      <div class="films-side films-side--right">
        <span class="films-title-text" id="films-title">Original Films</span>
      </div>
    </div><!-- /.films-stage -->
  </div><!-- /.films-intro -->

  <!-- Page content (shown after animation collapses) -->
  <div class="films-content" id="films-content">
    <main id="main" class="main">
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">
            <span class="eyebrow-dot" aria-hidden="true"></span>
            <span>Films</span>
          </div>
          <h1>Original <span class="accent">Films</span></h1>
          <p class="lead">Short films, produced by Magma Labs.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="project-banner-stack" data-films-featured aria-label="Featured films"></div>
          <div class="project-banner-grid"  data-films-secondary></div>
          <div class="fineprint" data-films-status aria-live="polite"></div>
          <noscript>
            <p class="fineprint">Enable JavaScript to load films from films.json.</p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
    <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="/script.js" defer></script>
  <script>
    (function () {
      "use strict";
      /* Skip if reduced motion — CSS already hides the intro */
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      var intro   = document.getElementById("films-intro");
      var bg      = document.getElementById("films-bg");
      var shine   = document.getElementById("films-shine");
      var core    = document.getElementById("films-core");
      var spokes  = document.getElementById("films-spokes");
      var brand   = document.getElementById("films-brand");
      var title   = document.getElementById("films-title");
      var content = document.getElementById("films-content");

      if (!intro || !bg) return;

      /* Lock scroll during animation */
      document.body.style.overflow = "hidden";

      function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      /* Animation sequence */
      wait(50)                                  /* give browser a tick */
        .then(function () {
          bg.classList.add("is-faded");         /* Phase 1: black fades over 1.5 s */
          return wait(1400);
        })
        .then(function () {
          shine.classList.add("is-shining");    /* Phase 2: diagonal shine (0.5 s) */
          return wait(600);
        })
        .then(function () {
          core.classList.add("is-in");          /* Phase 3 centre: core pops in */
          brand.classList.add("is-visible");    /* Phase 3 sides: text fades (3 s) */
          title.classList.add("is-visible");
          return wait(1000);
        })
        .then(function () {
          spokes.classList.add("is-up");        /* Spokes rise within arms (0.9 s) */
          return wait(1000);
        })
        .then(function () {
          spokes.classList.add("is-fanned");    /* Arms fan clockwise (0.9 s) */
          return wait(1000);
        })
        .then(function () {
          intro.classList.add("is-collapsed");  /* Collapse to top 50 vh */
          document.body.style.overflow = "";
          return wait(950);
        })
        .then(function () {
          content.classList.add("is-visible");  /* Reveal film cards */
        });
    })();
  </script>
</body>
</html>
