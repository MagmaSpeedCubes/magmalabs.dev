<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meet the Magma Labs Team</title>
    <meta
      name="description"
      content="Meet the Magma Labs team. Senior engineers and product builders focused on shipping reliable software."
    />
    <link rel="icon" type="image/svg+xml" href="/site-data/logo.svg" />
    <link rel="stylesheet" href="/site-data/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-header data-site-header></header>

    <main id="main" class="main">
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">
            <span class="eyebrow-dot" aria-hidden="true"></span>
            <span>Team</span>
          </div>
          <h1>
            <span class="accent">Team</span> 
          </h1>
          <p class="lead">
            Me, myself, my laptop, and my 3D printers
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-header">
            <div class="kicker">People</div>
          </div>

          <div class="grid cols-3" data-team-list aria-label="Team members"></div>
          <noscript>
            <p class="fineprint">
              Enable JavaScript to load team members from <code>team.json</code>.
            </p>
          </noscript>
        </div>
      </section>

      <section class="section alt">
        <div class="container">
          <div class="section-header">
            <div class="kicker">Careers</div>
            <h2>Roles</h2>
          </div>

          <div class="grid cols-2">
            <div class="card">
              <h3>Open roles</h3>
              <p>
                Email us your resume and a short note about what you want to
                build.
              </p>
              <div class="inline-links">
                <button
                  class="btn secondary"
                  type="button"
                  data-copy="info@magmalabs.dev"
                >
                  Copy careers email
                </button>
                <a class="btn ghost" href="/#contact">General inquiry</a>
              </div>
            </div>

            <!-- <div class="card">
              <h3>What we look for</h3>
              <p>
                Strong fundamentals, clear communication, and a bias toward
                shipping real value.
              </p>
              <ul class="list" aria-label="Hiring traits">
                <li>Write readable, maintainable code</li>
                <li>Think in systems and tradeoffs</li>
                <li>Care about users and reliability</li>
              </ul>
            </div> -->
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="/site-data/core.js" defer></script>
    <script src="/script.js" defer></script>
  </body>
</html>
