<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magma Labs Documentation</title>
    <meta
      name="description"
      content="Browse Magma Labs documentation links and preview local PDFs, markdown, and text files."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-header data-site-header></header>

    <main id="main" class="main">
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">
            <span class="eyebrow-dot" aria-hidden="true"></span>
            <span>Documentation</span>
          </div>
          <h1>
            Project <span class="accent">Documentation</span>
          </h1>
          <p class="lead">
            Browse by category, then preview local PDFs, markdown files, and text documents directly in the page.
          </p>
        </div>
      </section>

      <section class="section alt">
        <div class="container">
          <div class="section-header">
            <div class="kicker">Index</div>
            <h2>Browse by category</h2>
            <p>
              Categories can contain both reference links and local files from a repository folder.
            </p>
          </div>

          <!-- <section class="card docs-viewer-card" aria-label="Document preview">
            <div class="docs-viewer-head">
              <div class="docs-viewer-copy">
                <h3 data-docs-viewer-title>Document viewer</h3>
                <p data-docs-viewer-summary>
                  Select a local PDF, markdown file, or text file to preview it here.
                </p>
              </div>
              <div class="docs-viewer-meta" data-docs-viewer-meta>No document selected</div>
            </div>
            <div class="inline-links docs-viewer-actions" data-docs-viewer-actions></div>
            <div class="docs-viewer-content" data-docs-viewer></div>
          </section> -->

          <div class="fineprint" id="docs-count" aria-live="polite"></div>
          <div class="docs-grid" data-docs-list aria-label="Documentation categories"></div>
          <noscript>
            <p class="fineprint">
              Enable JavaScript to load documentation from <code>docs.json</code>.
            </p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="/script.js" defer></script>
  </body>
</html>
