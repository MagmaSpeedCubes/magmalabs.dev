<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magma Labs Documentation</title>
    <meta
      name="description"
      content="Browse Magma Labs documentation links organized by project category."
    />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-header data-site-header></header>

    <main id="main" class="main">
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">
            <span class="eyebrow-dot" aria-hidden="true"></span>
            <span>Documentation</span>
          </div>
          <h1>
            Project <span class="accent">Documentation</span>
          </h1>
          <p class="lead">
            Open a category, pick a project, and jump straight to its reference page.
          </p>
        </div>
      </section>

      <section class="section alt">
        <div class="container">
          <div class="section-header">
            <div class="kicker">Index</div>
            <h2>Browse by category</h2>
            <p>
              Each category expands into a curated list of project links.
            </p>
          </div>

          <div class="fineprint" id="docs-count" aria-live="polite"></div>
          <div class="docs-grid" data-docs-list aria-label="Documentation categories"></div>
          <noscript>
            <p class="fineprint">
              Enable JavaScript to load documentation from <code>docs.json</code>.
            </p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="script.js" defer></script>
  </body>
</html>
