<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magma Labs Awards</title>
    <meta
      name="description"
      content="Awards and recognitions earned by Magma Labs projects and community work."
    />
    <link rel="icon" type="image/svg+xml" href="/site-data/logo.svg" />
    <link rel="stylesheet" href="/site-data/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-header data-site-header></header>

    <main id="main" class="main">
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">
            <span class="eyebrow-dot" aria-hidden="true"></span>
            <span>Awards</span>
          </div>
          <h1>
            <span class="accent">Awards</span>
          </h1>
          <p class="lead">
            Recognition for projects, events, and community work.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-header">
            <div class="kicker">Gallery</div>
          </div>

          <div class="grid cols-3" data-awards-list aria-label="Awards"></div>
          <noscript>
            <p class="fineprint">
              Enable JavaScript to load awards from <code>awards.json</code>.
            </p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="/site-data/core.js" defer></script>
    <script src="/script.js" defer></script>
  </body>
</html>
