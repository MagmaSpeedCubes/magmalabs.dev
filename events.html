<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magma Labs Events</title>
    <meta
      name="description"
      content="Upcoming and past events hosted or attended by Magma Labs."
    />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-header data-site-header></header>

    <main id="main" class="main">
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">
            <span class="eyebrow-dot" aria-hidden="true"></span>
            <span>Events</span>
          </div>
          <h1>
            <span class="accent">Events</span>
          </h1>
          <p class="lead">
            Upcoming meetups, game jams, demos, and community happenings.
          </p>
        </div>
      </section>

      <section class="section alt" data-events-featured hidden>
        <div class="container">
          <div class="section-header">
            <div class="kicker">Featured</div>
            <h2>Next up</h2>
            <p>RSVP while spots are open.</p>
          </div>
          <div data-events-banner aria-live="polite"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-header">
            <div class="kicker">Upcoming</div>
            <h2>Upcoming events</h2>
          </div>

          <div class="grid cols-2" data-events-upcoming aria-label="Upcoming events"></div>
          <noscript>
            <p class="fineprint">
              Enable JavaScript to load events from <code>events.json</code>.
            </p>
          </noscript>
        </div>
      </section>

      <section class="section alt">
        <div class="container">
          <div class="section-header">
            <div class="kicker">Archive</div>
            <h2>Past events</h2>
          </div>

          <div class="grid cols-2" data-events-past aria-label="Past events"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="script.js" defer></script>
  </body>
</html>
